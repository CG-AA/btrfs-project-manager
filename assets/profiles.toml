# Built-in project profiles. A [profiles.<name>] table in /etc/bpm/config.toml replaces one of these.
[rust]
markers = ["Cargo.toml"]
banlist = ["target"]

[cmake]
markers = ["CMakeLists.txt"]
banlist = ["build", "cmake-build-debug", "cmake-build-release", "out"]

[just]
markers = ["justfile", "Justfile", ".justfile"]
banlist = ["build"]

# precreate = false: an empty `build` directory bpm creates would make a non-phony `build:` target
# look up to date
[make]
markers = ["Makefile", "makefile", "GNUmakefile"]
banlist = ["build"]
precreate = false

[node]
markers = ["package.json"]
banlist = ["node_modules", "dist", ".next", ".turbo"]

[python]
markers = ["pyproject.toml", "requirements.txt", "setup.py"]
banlist = [".venv", "venv", "__pycache__", ".mypy_cache", ".pytest_cache", ".ruff_cache"]

[generic]
markers = []
banlist = []
