[package]
name = "bpm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "btrfs project manager: per-project subvolumes, change-driven snapshots, idle lifecycle"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bpm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
humantime = "2"
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
